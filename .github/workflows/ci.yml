name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Verifies the documented GCC 14 floor. Ubuntu 24.04 has no Botan >= 3.9
  # package, so the crypto-dependent libraries are skipped at configure time
  # and this covers the rest (util coroutines, serialisation, event_system, ...).
  linux-gcc14:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libasio-dev libsqlite3-dev libncurses-dev libasound2-dev
      - name: configure
        run: cmake --preset default
      - name: build
        run: cmake --build --preset default -j"$(nproc)"
      - name: test
        run: ctest --preset default

  # Full build and test including crypto/network/infrastructure on current
  # Fedora (GCC 16, Botan 3.9) — the toolchain the libraries are developed with.
  linux-gcc-latest:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: install dependencies
        run: dnf install -y gcc-c++ cmake make git asio-devel botan3-devel sqlite-devel ncurses-devel alsa-lib-devel
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: configure
        run: cmake --preset default
      - name: build
        run: cmake --build --preset default -j"$(nproc)"
      - name: test
        run: ctest --preset default

  # mingw cross-compile only; the wine test run stays local (ctest --preset windows).
  windows-cross:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: install dependencies
        run: dnf install -y mingw64-gcc-c++ cmake make git
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: configure
        run: cmake --preset windows
      - name: build
        run: cmake --build --preset windows -j"$(nproc)"

  # MSVC build of the windows-buildable subset: core libraries, audio
  # (DirectSound) and database/common (sqlite3 from vcpkg). crypto/network
  # are skipped for now: vcpkg botan (3.12) is new enough but builds from
  # source (~15 min/run), so enabling it needs binary caching first.
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: install dependencies
        run: vcpkg install sqlite3:x64-windows
      - name: configure
        shell: pwsh
        # CMAKE_BUILD_TYPE has no effect on the multi-config build itself, but
        # the vcpkg toolchain uses it to pick release instead of debug libraries
        run: >
          cmake -B build-msvc -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
      - name: build
        run: cmake --build build-msvc --config Release --parallel
      - name: test
        run: ctest --test-dir build-msvc -C Release --output-on-failure
